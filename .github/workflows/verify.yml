name: verify formula
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3
      - run: brew install beepgrid/tap/beepgrid
      - run: brew test beepgrid/tap/beepgrid
      - run: brew audit --strict beepgrid/tap/beepgrid
      - run: beepgrid version
